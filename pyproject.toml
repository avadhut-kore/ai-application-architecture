[project]
name = "ai-architecture-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["opentelemetry-api==1.45.2", "opentelemetry-sdk==1.45.2"]

[dependency-groups]
dev = ["ruff", "mypy", "coverage", "bandit", "pip-audit"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "building-blocks/python/tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Standalone monorepo entry points deliberately establish import roots first.
ignore = ["E402"]

[tool.coverage.run]
branch = true
relative_files = true
parallel = true
patch = ["subprocess", "_exit"]
